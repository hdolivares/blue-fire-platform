[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 20_000
via_ir = true
evm_version = "shanghai"

# [profile.default.model_checker]
# contracts = {}
# engine = "chc"
# timeout = 10000

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 1000, depth = 20, fail_on_revert = false }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options 

[profile.default.fuzz]
runs = 256

# Exclude script directory from test discovery
test = "test"
script = "script" 